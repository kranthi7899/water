# Water seed: people roster
# Source of truth for who works on what. Connectors (Linear, Gmail, Slack) resolve to these records;
# they never define people themselves.
#
# As of: 2026-09-25
# allocation: fraction of a 40h week, per project. Hours invested are derived, not stored:
#   hours = allocation * 40 * weeks_since(project.start_date)
# identities: how each connector refers to this person. Linear uses the Owner label for now
# (people are not real Linear members). Email and Slack handles are placeholders to fill in.

