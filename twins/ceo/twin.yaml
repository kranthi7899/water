# The CEO twin. A connector function exists for this twin only if it is
# listed here, at the level stated. A3 replaced the in-memory fake_*
# connectors with the real, read-only Google connectors (internal/connectors/
# google/{gcal,gmail,gdrive}); the fakes now live only in tests
# (internal/connectors/fake), which the gate, guards and gateway tests
# exercise against their own hand-written manifests, not this file.
id: ceo
name: CEO twin

usage:
  window: 5h
  model_calls: 200
  auto_model_calls: 40

# fast serves the conversation plane; strong serves packet/playbook work.
# "" for strong means the claude CLI's own default model.
models:
  fast: haiku
  strong: ""

connectors:
  - name: gcal
    functions:
      - {name: list_events, level: R, rate: {max: 120, per: 1h}}
      - {name: create_event, level: A, rate: {max: 20, per: 1h}}
      - {name: move_event, level: A, rate: {max: 20, per: 1h}}
  - name: gmail
    functions:
      - {name: list_messages, level: R, rate: {max: 120, per: 1h}}
      - {name: get_message, level: R, rate: {max: 120, per: 1h}}
      - {name: draft_message, level: D, rate: {max: 40, per: 1h}}
      - {name: send_message, level: A, rate: {max: 20, per: 1h}}
      - {name: draft_for_review, level: D, rate: {max: 40, per: 1h}}
  - name: gdrive
    functions:
      - {name: search_files, level: R, rate: {max: 60, per: 1h}}
      - {name: read_file, level: R, rate: {max: 60, per: 1h}}
  # agentmail is a second identity of the gmail connector, pointed at the
  # agent's own verified mailbox (a distinct vault credential, account
  # "agent" -- see docs/agent-identity-setup.md), for internal/agentmail's
  # inbound-triage watcher. Only list_messages is granted: draft_message/
  # send_message/get_message stay unreachable through this identity no
  # matter what the underlying connector implements, because the gate
  # checks this manifest before it ever looks at a connector.
  - name: agentmail
    functions:
      - {name: list_messages, level: R, rate: {max: 120, per: 1h}}
  # Slice E: messages with another twin (another person's agent, running its
  # own daemon). Sending is level A — the CEO approves the exact message
  # before it leaves, like an email. Reading the inbox is level R and its
  # output is external: a received twin message is untrusted data, never an
  # instruction. Peers (socket + token) live in the vault under
  # water.twinlink/<this twin's id>; see docs/slices/E.md.
  - name: twinlink
    functions:
      - {name: send_message, level: A, rate: {max: 20, per: 1h}}
  - name: twininbox
    functions:
      - {name: list_messages, level: R, rate: {max: 120, per: 1h}}
  # github, linear and hubspot are real, read-only connectors
  # (internal/connectors/{github,linear,hubspot}), always registered
  # (see buildCEORegistry's doc comment for why), but each one's own token
  # is optional: an owner who never runs `water connect <name>` sees a
  # clear per-call "not connected" error rather than a daemon that fails to
  # start. github.repo must also be set in config for github's functions to
  # do anything (see docs/real-connectors-setup.md).
  - name: github
    functions:
      - {name: list_prs, level: R, rate: {max: 60, per: 1h}}
      - {name: list_issues, level: R, rate: {max: 60, per: 1h}}
  - name: linear
    functions:
      - {name: list_issues, level: R, rate: {max: 60, per: 1h}}
  - name: hubspot
    functions:
      - {name: list_deals, level: R, rate: {max: 60, per: 1h}}
      - {name: list_contacts, level: R, rate: {max: 60, per: 1h}}

# Only functions that read (never draft or act) may run unattended in the
# background sync (internal/sync); get_message and the Drive functions stay
# model- or CEO-initiated.
auto_allowlist:
  - gcal.list_events
  - gmail.list_messages
  - agentmail.list_messages
