# Base theme: early-90s telecom terminal. Dark CRT field, one saturated panel, cream display type, uppercase labels, thin rules, a single red accent line.
# Palette and ornament ONLY. Layout, spacing and interaction are computed by
# internal/layout and are identical across themes (invariant #7).
theme:
  name: water-base
  role: ""
  palette:
    background: "#050505"
    panel:      "#0B4FA8"
    foreground: "#E8E4D0"
    muted:      "#6B6B6B"
    accent:     "#D00000"
    signal:     "#2BE82B"
  typography:
    family: monospace
    labels: uppercase
  borders:
    style: ascii
    weight: 1
  imagery:
    style: pixel_art
    scaling: nearest
    dithering: ordered
  density: compact
  hero:
    title: WATER
    lines:
      - "  ##      ##    ##    ########  ########  ########  "
      - "  ##      ##   ####      ##     ##        ##    ##  "
      - "  ##  ##  ##  ##  ##     ##     ######    ########  "
      - "  ##  ##  ##  ######     ##     ##        ##  ##    "
      - "   ###  ###   ##  ##     ##     ########  ##   ###  "
      - "                                                    "
      - "  ..:::::..    ..:::::..    ..:::::..    ..:::::..  "
      - " :::.....:::  :::.....:::  :::.....:::  :::.....::: "
