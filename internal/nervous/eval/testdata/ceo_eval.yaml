# template file exists (task R-9) — see docs/slices/R.md's Design §18 and
# Risks item 19 ("eval leakage"). Do not hand-tune this file's wording to
# match a specific template later; that would defeat the point of a
# held-out set. Slot label conventions here follow internal/nervous/slots'
# actual Value.Label output (dates: "today"/"tomorrow"/a bare lowercase
