id: budget_request
title: Budget request
trigger: >-
  Someone is asking for money: a purchase, a renewal, a headcount budget, a
  raise, or any other spend that needs the CEO's approval.
needs:
  - name: requester_history
    fetch: gmail.list_messages
    kind: lookup
    args: {query: "from:{sender}"}
  - name: cash_position
    fetch: company_finance.cash_position
    kind: lookup
  - name: budget_status
    fetch: company_finance.budget_status
    kind: lookup
    args: {application: "{keywords}"}
  - name: comparable_requests
    fetch: gdrive.search_files
    kind: research
    args: {query: "{keywords}"}
default_rule: >-
  Approve if the amount is under $2,000 and runway stays above 6 months
  after it; otherwise route to the CEO with the full packet.
staged_actions:
  - gmail.send_message
severity_weight: 2
---
`staged_actions` names only `gmail.send_message` (level A): the Slice C
write increment (docs/slice-c-planning.md) shipped `gmail.draft_message` at
level D, and a staged action must be level A (it exists to be queued for the
CEO's approval; a D-level draft has no external effect and runs directly,
so it was never a fit here — drafting a follow-up is still available to the
twin as an ordinary tool call, just not as a card's staged action).

The threshold in `default_rule` follows the board policy in
`twins/ceo/role.md`'s "Budget structure" section; update both together if
that policy changes.

`cash_position` and `budget_status` replace what used to be a Drive-exported-
CSV read plus a code-side parser (`internal://budget_request.compute_runway`,
which pointed at a `CONFIGURE_ME_drive_file_id_of_the_runway_spreadsheet`
placeholder that was never actually filled in): they now call
`company_finance` (`internal/connectors/google/gsheets`) directly, a real,
read-only connector over Renaissance_Finance, the company's real financial
model, reading a specific tab and cell range live rather than parsing an
exported CSV blob. `cash_position` takes no args (a fixed range, `Cash &
runway!B19:B21`); `budget_status` takes `application`, filled from
`{keywords}` (the same placeholder `comparable_requests` already uses for a
"search-ish" purpose) since there is no dedicated per-decision "which
product/application is this about" extraction yet — a real gap if the
extracted keywords don't reliably name a product, worth revisiting once
this has run against real budget requests. Both come back through the
ordinary connector-evidence path (`Builder.resolve` → `Card.Evidence`), not
a compute function, since `company_finance` already returns real, structured
numbers rather than raw text needing to be parsed. A missing match (no
`application` row found, or the sheet unreachable) still degrades through
the normal readiness rule — `gate.Invoke` failing or `budget_status`
reporting no match never fails the whole build or invents a number.

`comparable_requests` is a keyword search over Drive for similar past asks,
the same pattern `generic`'s own needs use; it is research, not part of the
runway math.

This type is classified, not run on every synced message: the daemon only
offers an item to `Classify` when the brief's existing "needs attention"
heuristic (`internal/runtime/brief.go`) already flagged it as worth a human
look, and each item is classified at most once (cached by its
`store.Meta` `Source`+`SourceID`). The cached verdict is not tied to the
item's content: it is cleared only by an explicit `Triager.Forget`, and a
verdict the model's reply could not be read for is never cached durably
(it is retried later instead of pinning the item to `generic`). Classification itself still decides
whether the flagged item is a budget request at all, or something else, or
nothing needing a decision.
