# Design: long-hair figure. Saturated violet on near-black; the most chromatic theme.
# Palette and ornament ONLY. Layout, spacing and interaction are computed by
# internal/layout and are identical across themes (invariant #7).
theme:
  name: design
  role: "design"
  palette:
    background: "#0A0518"
    panel:      "#1E0F3A"
    foreground: "#B8D8F0"
    muted:      "#6B4FD8"
    accent:     "#FF2D95"
    signal:     "#2BE82B"
  typography:
    family: monospace
    labels: uppercase
  borders:
    style: ascii
    weight: 1
  imagery:
    style: pixel_art
    scaling: nearest
    dithering: ordered
  density: compact
  hero:
    title: DESIGN
    lines:
      - "            .-~~~~~-.             "
      - "          .'  ~~~~~  '.           "
      - "         /  .-'   '-.  \\          "
      - "        |  / .-. .-. \\  |         "
      - "        |  | (o) (o) |  |         "
      - "        |  \\   .-.   /  |         "
      - "        |   '-.___.-'   |         "
      - "        |  /  |   |  \\  |         "
      - "        | /   |   |   \\ |         "
      - "        |/    |   |    \\|         "
      - "        /     '---'     \\         "
      - "       /  ~~~~~~~~~~~~~  \\        "
