# The CEO twin's DEMO manifest — loaded only with `water daemon --demo` (or
# WATER_DEMO=1). This is a showcase surface, not a real integration: github,
# linear and hubspot below are internal/connectors/fake's in-memory, canned,
# clearly-fictional data sources (internal/connectors/fake/{github,linear,
# hubspot}.go). No network call, no OAuth, no API key exists for any of the
# three. See docs/demo.md and docs/EVOLUTION_PLAN.md's demo-slice log entry.
#
# Everything else here matches twins/ceo/twin.yaml exactly: the daemon's
# actual behavior (Google connectors, usage caps, models) is unchanged by
# --demo except for the three fake connectors added below.
id: ceo-demo
name: CEO twin (demo)

usage:
  window: 5h
  model_calls: 200
  auto_model_calls: 40

models:
  fast: haiku
  strong: ""

connectors:
  - name: gcal
    functions:
      - {name: list_events, level: R, rate: {max: 120, per: 1h}}
      - {name: create_event, level: A, rate: {max: 20, per: 1h}}
      - {name: move_event, level: A, rate: {max: 20, per: 1h}}
  - name: gmail
    functions:
      - {name: list_messages, level: R, rate: {max: 120, per: 1h}}
      - {name: get_message, level: R, rate: {max: 120, per: 1h}}
      - {name: draft_message, level: D, rate: {max: 40, per: 1h}}
      - {name: send_message, level: A, rate: {max: 20, per: 1h}}
  - name: gdrive
    functions:
      - {name: search_files, level: R, rate: {max: 60, per: 1h}}
      - {name: read_file, level: R, rate: {max: 60, per: 1h}}
  # --- demo-only fake connectors below; see internal/connectors/fake ---
  - name: github
    functions:
      - {name: list_prs, level: R, rate: {max: 60, per: 1h}}
      - {name: list_issues, level: R, rate: {max: 60, per: 1h}}
  - name: linear
    functions:
      - {name: list_issues, level: R, rate: {max: 60, per: 1h}}
  - name: hubspot
    functions:
      - {name: list_deals, level: R, rate: {max: 60, per: 1h}}
      - {name: list_contacts, level: R, rate: {max: 60, per: 1h}}
  # display.show (internal/connectors/display) puts a short title and a
  # plain-text body on the CEO's screen during a turn (the model calls it on
  # voice when seeing beats hearing). No network, no credential, no side
  # effect beyond the UI; the daemon sends it to the active turn as an
  # artifact event. Model-initiated only: never on the auto allowlist.
  - name: display
    functions:
      - {name: show, level: R, rate: {max: 30, per: 1h}}
  # research.web (internal/connectors/research) answers a short plain-words
  # question about live public information (weather, news, "latest",
  # prices) with a summary and sources. It runs a separate, cold `claude
  # --print` on the subscription with only WebSearch/WebFetch (the twin
  # keeps --tools ""), no credential, no API key. Its output is untrusted
  # web content (External), so a call taints the session. Model-initiated
  # only: never on the auto allowlist. Each call is a subscription model
  # call, hence the modest cap.
  - name: research
    functions:
      - {name: web, level: R, rate: {max: 20, per: 1h}}

# Same as production: only functions that read (never draft or act) may run
# unattended in the background sync. The fake connectors are not on this
# list — they are model- or CEO-initiated (`water ask`) and decision-card
# fetches only, never a background poll of fake data.
auto_allowlist:
  - gcal.list_events
  - gmail.list_messages
