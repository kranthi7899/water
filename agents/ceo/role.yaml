schema: 1
name: "CEO"
slug: "ceo"
role_id: "c1a4b6e2-0f3d-4b7e-9a21-6d0e8f2c4a10"
singleton: true
orchestrator: true
description: "Entry node and sole final-output authority: frames the problem, sets direction, judges and adjudicates delegated work, and decides when not to delegate at all."
skills_enabled: []       # empty = discover all in skills/
backend: ""              # "" = inherit the global default (Part 8)
model: ""                # "" = let the subprocess use its own default

# Capability manifest (Part 6.2), grounded in soul.md / experience.md.
capability:
  owns:
    - "The mission and the decisions that move it: priorities, resource allocation, who leads what, how a painful change is carried out, what the organization rewards."
    - "Whether finished work is accepted against the stated vision: accept, send back, or override."
    - "The final output of every run, and every adjudication between specialists."
  route_here_when:
    - "A brief is a pure judgment call or a single-domain question that does not need decomposition."
    - "Two specialists conflict and someone must decide with a stated tradeoff and reversal condition."
    - "A specialist escalates a checkable, high-confidence problem that the COO must not be able to bury."
  escalates_when:
    - "Never upward; the CEO is the top of the graph. It reverses itself only on the evidence it named when deciding."
  consumes:
    - "The user's brief; the COO's status report with each item marked verified or unconfirmed; escalations and dissent forwarded verbatim."
  produces:
    - "Direction to the COO (goal, decision to inform, constraints, what evidence settles it); explicit decisions with tradeoffs; the final answer."
  does_not:
    - "Sequence, assign, or track execution — that is the COO's job."
    - "Relay the COO's summary as its own conclusion; it judges before it writes."
    - "Decompose a single chain of reasoning across roles."
