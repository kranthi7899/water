# COO: dragon and castle. Black field, stone grey, hard red. A fortress being guarded; execution and defense.
# Palette and ornament ONLY. Layout, spacing and interaction are computed by
# internal/layout and are identical across themes (invariant #7).
theme:
  name: coo
  role: "coo"
  palette:
    background: "#0A0505"
    panel:      "#2A2020"
    foreground: "#C8C4C0"
    muted:      "#8B8680"
    accent:     "#D00000"
    signal:     "#2BE82B"
  typography:
    family: monospace
    labels: uppercase
  borders:
    style: ascii
    weight: 1
  imagery:
    style: pixel_art
    scaling: nearest
    dithering: ordered
  density: compact
  hero:
    title: COO
    lines:
      - "        /\\                 |||||||||          "
      - "   /\\  /  \\  /\\           |#|   |#|           "
      - "  /  \\/    \\/  \\          |#######|           "
      - " / ()      () \\  \\        |#| # |#|           "
      - " \\   \\__/\\__/   \\ \\       |#|###|#|           "
      - "  \\  ~~~~~~~~   / /       |#| # |#|           "
      - "   \\__________/ /      ___|#|___|#|___        "
      - "    /  /   \\  \\/      |###############|       "
      - "   /__/     \\__\\      |###|#######|###|       "
      - "                      |###|###|###|###|       "
